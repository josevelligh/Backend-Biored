project_id = "biored-backend"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"

[functions.api]
# Demo/Rally: la función acepta llamadas sin JWT para que el APK pueda consumirla
# con una sola URL. Para producción, pon `verify_jwt = true` y envía el anon key
# (la app ya soporta `Authorization: Bearer <anon key>`).
verify_jwt = false

[analytics]
enabled = false
